name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: podiumpanda-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Bootstrap CDK regions
        env:
          STAGE: ${{ inputs.stage || 'dev' }}
        shell: bash
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$account" =~ ^[0-9]{12}$ ]] || { echo "Invalid AWS account ID" >&2; exit 1; }
          regions=(eu-west-1)
          if [[ "$STAGE" == prod ]]; then regions+=(us-east-1); fi
          for region in "${regions[@]}"; do (
            credentials="$(aws sts assume-role --role-arn "arn:aws:iam::$account:role/cdk-hnb659fds-deploy-role-$account-$region" --role-session-name GitHubActionsBootstrap --output json)"
            AWS_ACCESS_KEY_ID="$(jq -er '.Credentials.AccessKeyId | strings | select(length > 0)' <<< "$credentials")"
            AWS_SECRET_ACCESS_KEY="$(jq -er '.Credentials.SecretAccessKey | strings | select(length > 0)' <<< "$credentials")"
            AWS_SESSION_TOKEN="$(jq -er '.Credentials.SessionToken | strings | select(length > 0)' <<< "$credentials")"
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            echo "::add-mask::$AWS_ACCESS_KEY_ID"
            echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
            echo "::add-mask::$AWS_SESSION_TOKEN"
            options=(--previous-parameters)
            stack="$(aws cloudformation list-stacks --region "$region" --query "StackSummaries[?StackName=='CDKToolkit' && StackStatus!='DELETE_COMPLETE'].StackName | [0]" --output text)"
            if [[ "$stack" == CDKToolkit ]]; then
              boundary="$(aws cloudformation describe-stacks --region "$region" --stack-name CDKToolkit --query "Stacks[0].Parameters[?ParameterKey=='InputPermissionsBoundary'].ParameterValue | [0]" --output text)"
              public_access_block="$(aws cloudformation describe-stacks --region "$region" --stack-name CDKToolkit --query "Stacks[0].Parameters[?ParameterKey=='PublicAccessBlockConfiguration'].ParameterValue | [0]" --output text)"
              if [[ -n "$boundary" && "$boundary" != None ]]; then
                options+=(--custom-permissions-boundary "$boundary")
              fi
              if [[ "$public_access_block" == false ]]; then
                options+=(--no-public-access-block-configuration)
              fi
            fi
            pnpm cdk bootstrap "aws://$account/$region" --role-arn "arn:aws:iam::$account:role/cdk-hnb659fds-cfn-exec-role-$account-$region" "${options[@]}"
          ); done
      - name: Deploy
        env:
          STAGE: ${{ inputs.stage || 'dev' }}
        run: pnpm cdk deploy --all --require-approval never --context "stage=$STAGE"
